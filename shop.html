        // Function to display products
        function displayProducts(category) {
            const container = document.getElementById('productsContainer');
            let filteredProducts = products;

            if (category !== 'all') {
                filteredProducts = products.filter(product => product.category === category);
            }

            if (filteredProducts.length === 0) {
                container.innerHTML = '<div class="no-results"><h3>No products found in this category</h3><p>Try another category!</p></div>';
                return;
            }

            let html = '';
            for (let product of filteredProducts) {
                let categoryName = '';
                if (product.category === 'men') categoryName = ' Men';
                else if (product.category === 'women') categoryName = 'Women';
                else categoryName = ' Accessories';

                html += `
                    <div class="card">
                        <img src="${product.image}" alt="${product.name}">
                        <h3>${product.name}</h3>
                        <div class="price">R${product.price}</div>
                        <div class="location">📍 ${product.location}</div>
                        <div class="category-badge">${categoryName}</div>
                        <form method="POST" action="cart.php">
                            <input type="hidden" name="product_id" value="${product.id}">
                            <input type="hidden" name="product_name" value="${product.name}">
                            <input type="hidden" name="product_price" value="${product.price}">
                            <input type="hidden" name="product_location" value="${product.location}">
                            <input type="hidden" name="product_image" value="${product.image}">
                            <button type="submit" name="add_to_cart">Add to Cart 🛒</button>
                        </form>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // Filter function
        function filterProducts(category) {
            // Update active button style
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.toLowerCase().includes(category) || (category === 'all' && btn.innerText === 'All')) {
                    btn.classList.add('active');
                }
            });

            // Display filtered products
            displayProducts(category);
        }

        // Scroll to top function
        function topFunction() {
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }

        // Load all products on page load
        displayProducts('all');
    </script>
